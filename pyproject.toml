[project]
name = "athena"
version = "0.1.0"
description = "A personal AI assistant that runs on your own hardware: Telegram, a local model, MCP tools, memory and tasks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.20,<4",
    "mcp>=2.3,<3",
    "python-telegram-bot>=22.0,<23",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tomlkit>=0.13",
    "yfinance>=1.7,<2",
    "packaging>=24",
    "pypdf>=6.21.1",
    "fpdf2>=2.8",
    "markdown-it-py>=3",
    # Runs agents' DAGs (src/athena/dags/): pinned to a commit, as it isn't on PyPI.
    "agentic-airflow @ git+https://github.com/georgeslane/agentic-airflow@d2dfb55b077e43154ceb3d03a903a40b61110e00",
]

[project.optional-dependencies]
# The read-only documents server that runs on your Mac (athena mac install): reading PDFs.
mac = [
    "pypdf>=6.21.1",
]

[project.scripts]
athena = "athena.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pypdf>=6.21.1",  # the Mac files server's tests read a real PDF
    "ruff==0.17.1",  # exact, so a new release's rules can't fail CI by themselves
    "playwright>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# agentic-airflow isn't on PyPI: it's installed from its repository, at the commit pinned in dependencies, so a
# package of the same name there can't be installed instead.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.uv]
# Use uv's own Python builds. Some others, like the python.org installer for macOS,
# can't load SQLite extensions, which the memory store (sqlite-vec) needs.
python-preference = "only-managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
