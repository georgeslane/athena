[project]
name = "pi-assistant"
version = "0.1.0"
description = "A personal AI assistant for a Raspberry Pi: Telegram front end, a local LLM over an OpenAI-compatible API, MCP tools and long-term memory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.20,<4",
    "mcp>=2.3,<3",
    "python-telegram-bot>=22.0,<23",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tomlkit>=0.13",
    "yfinance>=1.7,<2",
    "packaging>=24",
    "pypdf>=6.21.1",
    "fpdf2>=2.8",
    "markdown-it-py>=3",
]

[project.optional-dependencies]
# The read-only files server that runs on your Mac (scripts/mac/install.sh): reading PDFs.
mac = [
    "pypdf>=6.21.1",
]

[project.scripts]
pi-assistant = "pi_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pypdf>=6.21.1",  # the Mac files server's tests read a real PDF
    "ruff==0.17.1",  # exact, so a new release's rules can't fail CI by themselves
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_assistant"]

[tool.uv]
# Use uv's own Python builds. Some others, like the python.org installer for macOS,
# can't load SQLite extensions, which the memory store (sqlite-vec) needs.
python-preference = "only-managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
