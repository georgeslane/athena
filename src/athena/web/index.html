<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Athena</title>
  <meta name="description" content="Athena's dashboard: what it's doing and has done, how it's used, its skills and its tools.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5eee2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0b08" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Athena">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="athena.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="dashboard.css">
  <script type="module" src="dashboard.js"></script>
</head>
<body>
  <noscript><p class="noscript">The dashboard needs JavaScript.</p></noscript>

  <main id="sign-in" class="sign-in" hidden>
    <form class="sign-in-card" id="sign-in-form">
      <div class="shield shield-large" data-state="idle" aria-hidden="true">
        <img src="athena.svg" alt="" width="120" height="120">
        <span class="eye left"></span><span class="eye right"></span><span class="ring"></span>
      </div>
      <h1 class="wordmark" data-name>Athena</h1>
      <p class="muted">Sign in to the dashboard.</p>
      <input type="text" name="username" autocomplete="username" value="athena" hidden>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" id="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="sign-in-error" role="alert"></p>
      <button class="button primary wide" type="submit">Sign in</button>
      <p class="hint">It's <code>DASHBOARD_TOKEN</code> in <code>.env</code> on the Pi.</p>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="#status" aria-label="Status">
          <div class="shield shield-small" data-state="idle" aria-hidden="true">
            <img src="athena.svg" alt="" width="40" height="40">
            <span class="eye left"></span><span class="eye right"></span><span class="ring"></span>
          </div>
          <span class="wordmark" data-name>Athena</span>
        </a>
        <span class="pill" id="top-pill" data-state="idle"><span class="dot"></span><span class="pill-label">Idle</span></span>
        <nav class="tabs" aria-label="Sections">
          <a class="tab" href="#status" data-tab="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Status</span></a>
          <a class="tab" href="#activity" data-tab="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Activity</span></a>
          <a class="tab" href="#tasks" data-tab="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg><span>Tasks</span></a>
          <a class="tab" href="#memory" data-tab="memory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8"/></svg><span>Memory</span></a>
          <a class="tab" href="#skills" data-tab="skills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2zM12 6.5v13"/></svg><span>Skills</span></a>
          <a class="tab" href="#board" data-tab="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v7h-4z"/></svg><span>Board</span></a>
          <a class="tab" href="#tools" data-tab="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span>Tools</span></a>
        </nav>
      </div>
      <div class="meander" aria-hidden="true"></div>
    </header>

    <div class="banner" id="offline" role="status" hidden>Can't reach Athena. Trying again…</div>

    <section id="tab-status" class="panel" data-panel="status" aria-label="Status"></section>
    <section id="tab-activity" class="panel" data-panel="activity" aria-label="Activity" hidden></section>
    <section id="tab-tasks" class="panel" data-panel="tasks" aria-label="Tasks" hidden></section>
    <section id="tab-memory" class="panel" data-panel="memory" aria-label="Memory" hidden></section>
    <section id="tab-skills" class="panel" data-panel="skills" aria-label="Skills" hidden></section>
    <section id="tab-board" class="panel" data-panel="board" aria-label="Board" hidden></section>
    <section id="tab-tools" class="panel" data-panel="tools" aria-label="Tools" hidden></section>
  </div>

  <dialog id="dialog" class="dialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
