# Athena's settings. `athena setup` makes ~/.athena/config.toml from this, and sets the main ones.
# Secrets belong in .env; reference them here as ${NAME}.

data_dir = "data"                      # SQLite database (history + memory) lives here

[llm]
# oMLX (or any OpenAI-compatible server) on the Mac. Use its LAN/Tailscale hostname,
# e.g. "http://my-mac.local:8000/v1" or "http://my-mac.tailnet-name.ts.net:8000/v1".
base_url = "http://my-mac.local:8000/v1"
# Exactly as listed by the server; `athena doctor` prints the available ids.
model = "gemma-4-26b-a4b-it-4bit"
api_key = "${LLM_API_KEY}"
temperature = 0.7
max_tokens = 2048
timeout_seconds = 300
# Whether a model that can think does so before answering: "on", "off", or "short", which
# stops it after short_thinking_tokens (with oMLX). /think in Telegram and the dashboard change
# it. Left out, it's as the model server has it.
# thinking = "short"
# short_thinking_tokens = 1000
# Server-specific request options, passed through as-is.
# extra_body = { top_k = 20 }
# At startup, after /reload and every this many minutes, have the model server read the
# prompt, tools and your chat so far, so your next message doesn't wait while it does.
# It only takes a moment when they're already cached. 0 turns it off.
warm_up_minutes = 10
# The most the model can read at once, in tokens, shown on the dashboard. 0 asks the model server.
context_window = 0

[telegram]
bot_token = "${TELEGRAM_BOT_TOKEN}"
# Your numeric Telegram user ID. Leave empty at first: the bot then runs in setup
# mode and replies to any message with the sender's ID.
allowed_user_ids = []
confirm_timeout_seconds = 300          # how long an Allow/Deny prompt waits

[agent]
assistant_name = "Athena"
user_name = "the user"                 # your first name, used in the system prompt
timezone = "Europe/London"
# system_prompt_file = "my-prompt.md"       # your own instructions instead of Athena's
max_tool_rounds = 8                    # tool calls per message before forcing an answer
tool_timeout_seconds = 120
max_tool_result_chars = 6000
max_history_messages = 40              # past this, older messages are summarised (/compact does it now)
compact_at = 0.8                       # ...or when the conversation fills this much of the context window

[embeddings]
# The model that turns memories and documents into vectors, to search them by meaning. Empty
# base_url and api_key: the same server as the model, with its key, such as oMLX on the Mac,
# which serves EmbeddingGemma 2 from version 0.7.1 (docs/memory.md). For another server,
# set base_url, and api_key if it needs one.
base_url = ""
api_key = ""
# Exactly as the server lists it: `athena doctor` shows the list if it's not there.
# To change it later: athena embeddings switch MODEL (docs/memory.md).
model = "embeddinggemma-2-bf16"
dimensions = 768                       # EmbeddingGemma 2 also supports 512, 256 or 128
# Prompt formats EmbeddingGemma was trained with. Set both to "" for other models.
query_prefix = "task: search result | query: "
document_prefix = "title: {title} | text: "

[memory]
auto_recall = true                     # show the model memories related to each message
recall_top_k = 4
# Cosine distance cut-offs, which suit the embeddings model: `athena embeddings test` measures them.
recall_max_distance = 0.31             # auto-recall leaves out memories further away than this (lower = stricter)
duplicate_distance = 0.03              # a new fact closer than this to a saved one isn't saved again
search_top_k = 8
chunk_chars = 1200                     # passage size, for documents and `athena ingest`

[documents]
# Documents from folders on your Mac, which Athena indexes when you press Index now on the
# dashboard (Memory), so you can search them by meaning. The Mac needs setting up first
# (docs/memory.md): on the Pi, `athena mac connect ADDRESS USER laptop` makes the
# "athena-laptop" entry, and on the Mac, `athena mac install --documents` starts the server.
command = "ssh"
args = ["athena-laptop", "documents"]
folders = []                           # chosen on the dashboard
max_chars_per_file = 300000            # longer documents are indexed up to here

[display]
# The status board for a Pimoroni Display HAT Mini is its own service, pi-display-microservice,
# which asks Athena what it's doing through this API (see docs/dashboard.md).
enabled = true
host = "127.0.0.1"                     # only programs on this Pi can ask
port = 8091
token = ""                             # needed if host isn't 127.0.0.1; the board then sends the same
show_task = true                       # include the start of your message (false: just the status)

[dashboard]
# A web page for Athena's status, usage and tools, on your phone or Mac (see docs/dashboard.md).
# Its password is DASHBOARD_TOKEN in .env, which Athena makes the first time it starts.
enabled = true
host = "127.0.0.1"                     # Tailscale Serve passes requests from your devices to this
port = 8092
# Notifications on your iPhone and Mac show the start of each message. They're encrypted so that only
# your device can read them, but they do pass through Apple's push service. false: only that there's
# something new (see docs/dashboard.md).
notification_text = true

[news.feeds]
# News feeds (RSS or Atom) the assistant can read without asking: only these are ever
# fetched. Add your own; most news sites have one.
"BBC News" = "https://feeds.bbci.co.uk/news/rss.xml"
"The Guardian" = "https://www.theguardian.com/uk/rss"
"Financial Times" = "https://www.ft.com/rss/home"
"Hacker News" = "https://hnrss.org/frontpage"

[markets]
# Prices and history for stocks, funds, indices, currencies and commodities, from Yahoo Finance
# (see docs/tools.md). It sends Yahoo only ticker symbols and short searches, so it doesn't
# ask first. Switch it on here or on the dashboard's Tools tab.
enabled = false

[trading212]
# Your Trading 212 Invest or Stocks ISA account (see docs/tools.md). Reading it
# doesn't ask; placing or cancelling an order always asks you first, in Telegram.
enabled = false
api_key = "${TRADING212_API_KEY}"
api_secret = "${TRADING212_API_SECRET}"
environment = "live"                   # or "demo" for the practice account, which has its own key

[sqlite.databases]
# SQLite databases the assistant can query, read-only (see docs/tools.md). Only
# these files are ever opened. Name them however you like:
# "budget" = "/home/you/budget.db"

[code]
# run_python: Python that Athena writes, for sums, data and files, run in a sandbox with no network that
# sees nothing of yours but its own folder, data/workspace (docs/tools.md). Linux only.
enabled = true
timeout_seconds = 30                   # it's stopped after this long
memory_mb = 1024
max_output_chars = 10000               # of what it prints, given back to the model
max_file_mb = 50                       # the largest file it can write
workspace_mb = 500                     # past this, it can only delete files until there's room

[workspace]
# read_file, write_file and send_file: files in Athena's own folder, data/workspace, Markdown and PDFs
# among them, and sending them to you in Telegram; files you send Athena go there too (docs/tools.md).
enabled = true
max_read_mb = 20                       # the largest file it reads, or you can send it
max_send_mb = 50                       # the largest it sends you: Telegram takes up to 50 MB

[tools]
# Tools found when the model needs them, rather than described in every message, which keeps messages
# quicker to read: names or patterns of names (docs/tools.md). The dashboard's
# Tools tab shows how much each takes up and how often it's used.
on_demand = []

[mcp_registry]
# Lets Athena search the official MCP Registry for servers that would help with something it
# can't do yet, and suggest them (see docs/tools.md). You add any you want on the dashboard.
enabled = true

[claude_projects]
# Coding projects Athena hands to Claude as pull requests in a private GitHub repo, which tell you,
# and agents' DAGs, when they're done (see docs/claude-projects.md). Handing one over always asks you first.
enabled = false
repo = "your-name/zeus-solutions"      # owner/name; it must be private, with CLAUDE.md on main
branch = "main"
label = "claude"                       # what your routine's GitHub trigger looks for
token = "${PROJECTS_GITHUB_TOKEN}"     # for that repo only: Contents and Pull requests, read and write
poll_minutes = 30                      # how often the board reads the repo
start_minutes = 30                     # no status.json this long after the label: Claude didn't start
stalled_minutes = 120                  # no push for this long: Claude stopped part way
max_restarts = 6                       # starting it again, waiting longer each time, then telling you

[tasks]
# Agents' DAGs: the tasks Athena does by itself, on a schedule or when something happens, then tells you
# about (see docs/agents.md). A message from you is answered between tasks, before the next one starts.
enabled = true
quiet_minutes = 5                      # a scheduled run waits until Athena's been inactive this long
max_minutes = 30                       # the most a task works for, not counting waiting for your OK
max_tool_rounds = 25
thinking = "on"                        # tasks aren't in a hurry
confirm_minutes = 60                   # how long a task waits for you to allow a tool that asks

[triggers]
# Events that start agents' DAGs with "<event>" in their triggers: POST /hooks/<event> on the
# dashboard's address, from an iPhone Shortcut or anything on your tailnet (see docs/dags.md). Off
# until TRIGGERS_TOKEN is set in .env.
max_per_hour = 30                      # events taken in an hour, of every kind; more are refused

[security_updates]
# Every day, Athena checks the packages locked for MCP servers started with uvx for known vulnerabilities,
# updates each that has a fix to the version that fixes it, restarts the server and tells you
# (see docs/tools.md). The Tools tab shows what it found, with a Fix button.
enabled = true
every_hours = 24
automatic = true                       # false: just tell you, and you press Fix

[alerts]
# Athena messages you in Telegram when something it needs stops working, and when it's back
# (see docs/dashboard.md): the model server, embeddings, MCP servers, built-ins, free space.
enabled = true
every_minutes = 5                      # how often it checks
after_failures = 2                     # failed checks in a row before you're told, so a blip isn't
min_free_gb = 1                        # less free space than this where its data is is a problem

[privacy]
# Before a tool runs, Athena looks through what it would send for personal details
# (see docs/privacy-and-security.md): your private words, listed on the dashboard (Memory), your
# name, email addresses, phone numbers, postcodes and the like. These tools are stopped if they'd
# send any; other tools that ask first tell you what they found when they ask. Secrets from .env
# stop every tool.
block = ["hand_to_claude", "answer_claude", "extend_claude_project"]

[siri]
# Ask by voice: "Hey Siri, Ask Athena" on your iPhone or Mac (see docs/using.md).
# Your question and the answer also appear in the Telegram chat.
enabled = false
host = "127.0.0.1"                     # Tailscale Serve passes requests from your devices to this
port = 8090
token = "${SIRI_TOKEN}"                # the shortcut sends this to show it's yours; set it in .env
reply_timeout_seconds = 20             # Siri gives up after about 25s; slower answers go to Telegram

# ---------------------------------------------------------------------------
# MCP servers. Each one is either local (command = ..., spoken to over stdio)
# or remote (url = ..., Streamable HTTP; URLs ending in /sse use the older SSE
# transport). Tool filters use glob patterns on the server's own tool names:
#   include = [...]   only expose these tools (default: all)
#   exclude = [...]   hide these tools
#   confirm = [...]   ask for approval in Telegram before running these
#                     (default: all of them, since any tool might send your data
#                     off your network; set [] only for servers that can't)
#   arguments = {...} arguments Athena gives the tools itself, which the model
#                     isn't shown, such as which account to use
#   about = "..."     what the server is, for the model, when its tools don't
#                     say, such as whose account they use
# Local servers run in a sandbox, without your home folder (docs/tools.md):
#   network = false   no network access either (default: true)
#   read_only_paths = [...]   files or folders it may read
#   sandbox = false   run it without a sandbox: it can read everything you can
# Fewer tools = shorter prompts = faster replies, so only enable what you use.
# ---------------------------------------------------------------------------

[mcp_servers.time]
command = "uvx"
args = ["mcp-server-time==2026.8.18", "--local-timezone=Europe/London"]
confirm = []                           # local and read-only, so it needn't ask
network = false                        # it only reads the clock

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch==2026.8.18"]
# No `confirm` line, so every fetch asks first: a URL can carry your data to any
# website, for example if a fetched page tells the model to send it there.

# The servers below are switched off until you set them up (see docs/tools.md).
# The dashboard's Tools tab can do that for you, or copy any you want into your
# config.toml, fill them in and set enabled = true.

# Web search through DuckDuckGo, with no account. Each search asks first, because
# what you search for leaves your network.
[mcp_servers.search]
enabled = false
command = "uvx"
args = ["duckduckgo-mcp-server==0.7.0"]
include = ["search"]

# Your Mac: Calendar and Reminders, through iMCP, over SSH. Set up with `athena mac connect`
# on the Pi and `athena mac install --calendar` on the Mac (docs/mac.md).
[mcp_servers.apple]
enabled = false
command = "ssh"
args = ["athena-mac", "apple"]
include = ["calendars_list", "events_fetch", "events_create", "reminders_lists", "reminders_fetch", "reminders_create"]
confirm = ["events_create", "reminders_create"]   # adding things asks first; deleting isn't possible
about = "The user's own calendars and reminders, on their Mac."

# GitHub, read-only, through GitHub's own hosted server. GITHUB_TOKEN in .env should be
# a fine-grained token with only "Public repositories (read-only)" access. Lockdown
# hides text in issues from people without push access, which could carry instructions.
[mcp_servers.github]
enabled = false
url = "https://api.githubcopilot.com/mcp/readonly"
headers = { Authorization = "Bearer ${GITHUB_TOKEN}", "X-MCP-Lockdown" = "true", "X-MCP-Tools" = "search_repositories,get_file_contents,get_latest_release,list_commits,search_issues" }
include = ["search_repositories", "get_file_contents", "get_latest_release", "list_commits", "search_issues"]
confirm = []                           # public repos only; lookups go only to GitHub

# Company filings and financial statements from the SEC's EDGAR, with EdgarTools.
[mcp_servers.sec]
enabled = false
command = "uvx"
args = ["--from", "edgartools[ai]==5.60.0", "edgartools-mcp"]
env = { EDGAR_IDENTITY = "${EDGAR_IDENTITY}" }   # the SEC asks who's asking: set it in .env
include = ["edgar_company", "edgar_search", "edgar_filing", "edgar_read", "edgar_text_search"]
confirm = []                           # public filings; lookups go only to the SEC

# Email: an address of the assistant's own. It reads that inbox, and sends only with
# your OK. The server itself also refuses to do anything but send, or to send to anyone
# not in ALLOWED_RECIPIENTS, even if you approve.
[mcp_servers.email]
enabled = false
command = "uvx"
args = ["mcp-email-server==1.11.0", "stdio"]
include = ["list_emails_metadata", "get_emails_content", "send_email"]
confirm = ["send_email"]
arguments = { account_name = "athena" }   # Athena names its account, so the model needn't
about = "Your own inbox, not the user's: they forward you mail they want you to read or keep an eye on."

[mcp_servers.email.env]
MCP_EMAIL_SERVER_ACCOUNT_NAME = "athena"
MCP_EMAIL_SERVER_FULL_NAME = "Athena"
MCP_EMAIL_SERVER_EMAIL_ADDRESS = "athena@example.com"
MCP_EMAIL_SERVER_USER_NAME = "athena@example.com"
MCP_EMAIL_SERVER_PASSWORD = "${EMAIL_PASSWORD}"           # an app password, in .env
MCP_EMAIL_SERVER_IMAP_HOST = "imap.example.com"
MCP_EMAIL_SERVER_IMAP_PORT = "993"
MCP_EMAIL_SERVER_IMAP_SSL = "true"
MCP_EMAIL_SERVER_SMTP_HOST = "smtp.example.com"
MCP_EMAIL_SERVER_SMTP_PORT = "465"
MCP_EMAIL_SERVER_SMTP_SSL = "true"
MCP_EMAIL_SERVER_ALLOWED_MUTATIONS = "send"               # never delete, move, flag or draft
MCP_EMAIL_SERVER_ALLOWED_RECIPIENTS = "you@example.com"   # comma-separated; * matches anything
