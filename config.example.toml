# pi-assistant configuration.
# Copy to config.toml (install.sh does this) and edit. config.toml is git-ignored.
# Secrets belong in .env; reference them here as ${NAME}.

data_dir = "data"                      # SQLite database (history + memory) lives here

[llm]
# oMLX (or any OpenAI-compatible server) on the Mac. Use its LAN/Tailscale hostname,
# e.g. "http://my-mac.local:8000/v1" or "http://my-mac.tailnet-name.ts.net:8000/v1".
base_url = "http://my-mac.local:8000/v1"
# Exactly as listed by the server; `pi-assistant doctor` prints the available ids.
model = "gemma-4-26b-a4b-it-4bit"
api_key = "${LLM_API_KEY}"
temperature = 0.7
max_tokens = 2048
timeout_seconds = 300
# Server-specific request options, passed through as-is. For example, to turn off
# "thinking" on models that support it:
# extra_body = { chat_template_kwargs = { enable_thinking = false } }
# At startup, after /reload and every this many minutes, have the model server read the
# prompt, tools and your chat so far, so your next message doesn't wait while it does.
# It only takes a moment when they're already cached. 0 turns it off.
warm_up_minutes = 10
# The most the model can read at once, in tokens, shown on the dashboard. 0 asks the model server.
context_window = 0

[telegram]
bot_token = "${TELEGRAM_BOT_TOKEN}"
# Your numeric Telegram user ID. Leave empty at first: the bot then runs in setup
# mode and replies to any message with the sender's ID.
allowed_user_ids = []
confirm_timeout_seconds = 300          # how long an Allow/Deny prompt waits

[agent]
assistant_name = "Athena"
user_name = "the user"                 # your first name, used in the system prompt
timezone = "Europe/London"
system_prompt_file = "prompts/system.md"
max_tool_rounds = 8                    # tool calls per message before forcing an answer
tool_timeout_seconds = 120
max_tool_result_chars = 6000
max_history_messages = 40

[embeddings]
# Ollama on the Pi serves the embeddings model (installed by scripts/install.sh).
base_url = "http://127.0.0.1:11434/v1"
# To change it later: bash scripts/switch-embeddings.sh MODEL (README, "Changing the embeddings model").
model = "embeddinggemma"
api_key = "ollama"
dimensions = 768                       # EmbeddingGemma also supports 512, 256 or 128
# Prompt formats EmbeddingGemma was trained with. Set both to "" for other models.
query_prefix = "task: search result | query: "
document_prefix = "title: {title} | text: "

[memory]
auto_recall = true                     # show the model memories related to each message
recall_top_k = 4
# Cosine distance cut-offs, which suit the embeddings model: `pi-assistant embeddings test` measures them.
recall_max_distance = 0.55             # auto-recall leaves out memories further away than this (lower = stricter)
duplicate_distance = 0.04              # a new fact closer than this to a saved one isn't saved again
search_top_k = 8
chunk_chars = 1200                     # chunk size for `pi-assistant ingest`

[display]
# The status board for a Pimoroni Display HAT Mini is its own service, pi-display-microservice,
# which asks Athena what it's doing through this API (see README, "Status board").
enabled = true
host = "127.0.0.1"                     # only programs on this Pi can ask
port = 8091
token = ""                             # needed if host isn't 127.0.0.1; the board then sends the same
show_task = true                       # include the start of your message (false: just the status)

[dashboard]
# A web page for Athena's status, usage and tools, on your phone or Mac (see README, "Dashboard").
# Its password is DASHBOARD_TOKEN in .env, which Athena makes the first time it starts.
enabled = true
host = "127.0.0.1"                     # Tailscale Serve passes requests from your devices to this
port = 8092

[news.feeds]
# News feeds (RSS or Atom) the assistant can read without asking: only these are ever
# fetched. Add your own; most news sites have one.
"BBC News" = "https://feeds.bbci.co.uk/news/rss.xml"
"The Guardian" = "https://www.theguardian.com/uk/rss"
"Financial Times" = "https://www.ft.com/rss/home"
"Hacker News" = "https://hnrss.org/frontpage"

[trading212]
# Your Trading 212 Invest or Stocks ISA account (see README, "Trading 212"). Reading it
# doesn't ask; placing or cancelling an order always asks you first, in Telegram.
enabled = false
api_key = "${TRADING212_API_KEY}"
api_secret = "${TRADING212_API_SECRET}"
environment = "live"                   # or "demo" for the practice account, which has its own key

[sqlite.databases]
# SQLite databases the assistant can query, read-only (see README, "Databases"). Only
# these files are ever opened. Name them however you like:
# "budget" = "/home/you/budget.db"

[siri]
# Ask by voice: "Hey Siri, Ask Athena" on your iPhone or Mac (see README, "Siri").
# Your question and the answer also appear in the Telegram chat.
enabled = false
host = "127.0.0.1"                     # Tailscale Serve passes requests from your devices to this
port = 8090
token = "${SIRI_TOKEN}"                # the shortcut sends this to show it's yours; set it in .env
reply_timeout_seconds = 20             # Siri gives up after about 25s; slower answers go to Telegram

# ---------------------------------------------------------------------------
# MCP servers. Each one is either local (command = ..., spoken to over stdio)
# or remote (url = ..., Streamable HTTP; URLs ending in /sse use the older SSE
# transport). Tool filters use glob patterns on the server's own tool names:
#   include = [...]   only expose these tools (default: all)
#   exclude = [...]   hide these tools
#   confirm = [...]   ask for approval in Telegram before running these
#                     (default: all of them, since any tool might send your data
#                     off your network; set [] only for servers that can't)
# Local servers run in a sandbox, without your home folder (README, "Sandbox"):
#   network = false   no network access either (default: true)
#   read_only_paths = [...]   files or folders it may read
#   sandbox = false   run it without a sandbox: it can read everything you can
# Fewer tools = shorter prompts = faster replies, so only enable what you use.
# ---------------------------------------------------------------------------

[mcp_servers.time]
command = "uvx"
args = ["mcp-server-time==2026.8.18", "--local-timezone=Europe/London"]
confirm = []                           # local and read-only, so it needn't ask
network = false                        # it only reads the clock

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch==2026.8.18"]
# No `confirm` line, so every fetch asks first: a URL can carry your data to any
# website, for example if a fetched page tells the model to send it there.

# The servers below are switched off until you set them up (see README, "MCP servers").
# The dashboard's Tools tab can do that for you, or copy any you want into your
# config.toml, fill them in and set enabled = true.

# Web search through DuckDuckGo, with no account. Each search asks first, because
# what you search for leaves your network.
[mcp_servers.search]
enabled = false
command = "uvx"
args = ["duckduckgo-mcp-server==0.7.0"]
include = ["search"]

# Your Mac: search and read the folders you choose (read-only), over SSH. Set up with
# scripts/connect-mac.sh on the Pi and scripts/mac/install.sh on the Mac.
[mcp_servers.files]
enabled = false
command = "ssh"
args = ["athena-mac", "files"]
confirm = []                           # read-only, and only the folders you chose

# Your Mac: Calendar and Reminders, through iMCP, set up with the files server.
[mcp_servers.apple]
enabled = false
command = "ssh"
args = ["athena-mac", "apple"]
include = ["calendars_list", "events_fetch", "events_create", "reminders_lists", "reminders_fetch", "reminders_create"]
confirm = ["events_create", "reminders_create"]   # adding things asks first; deleting isn't possible

# GitHub, read-only, through GitHub's own hosted server. GITHUB_TOKEN in .env should be
# a fine-grained token with only "Public repositories (read-only)" access. Lockdown
# hides text in issues from people without push access, which could carry instructions.
[mcp_servers.github]
enabled = false
url = "https://api.githubcopilot.com/mcp/readonly"
headers = { Authorization = "Bearer ${GITHUB_TOKEN}", "X-MCP-Lockdown" = "true", "X-MCP-Tools" = "search_repositories,get_file_contents,get_latest_release,list_commits,search_issues" }
include = ["search_repositories", "get_file_contents", "get_latest_release", "list_commits", "search_issues"]
confirm = []                           # public repos only; lookups go only to GitHub

# Company filings and financial statements from the SEC's EDGAR, with EdgarTools.
[mcp_servers.sec]
enabled = false
command = "uvx"
args = ["--from", "edgartools[ai]==5.60.0", "edgartools-mcp"]
env = { EDGAR_IDENTITY = "${EDGAR_IDENTITY}" }   # the SEC asks who's asking: set it in .env
include = ["edgar_company", "edgar_search", "edgar_filing", "edgar_read", "edgar_text_search"]
confirm = []                           # public filings; lookups go only to the SEC

# Email: an address of the assistant's own. It reads that inbox, and sends only with
# your OK. The server itself also refuses to do anything but send, or to send to anyone
# not in ALLOWED_RECIPIENTS, even if you approve.
[mcp_servers.email]
enabled = false
command = "uvx"
args = ["mcp-email-server==1.11.0", "stdio"]
include = ["list_available_accounts", "list_emails_metadata", "get_emails_content", "send_email"]
confirm = ["send_email"]

[mcp_servers.email.env]
MCP_EMAIL_SERVER_ACCOUNT_NAME = "athena"
MCP_EMAIL_SERVER_FULL_NAME = "Athena"
MCP_EMAIL_SERVER_EMAIL_ADDRESS = "athena@example.com"
MCP_EMAIL_SERVER_USER_NAME = "athena@example.com"
MCP_EMAIL_SERVER_PASSWORD = "${EMAIL_PASSWORD}"           # an app password, in .env
MCP_EMAIL_SERVER_IMAP_HOST = "imap.example.com"
MCP_EMAIL_SERVER_IMAP_PORT = "993"
MCP_EMAIL_SERVER_IMAP_SSL = "true"
MCP_EMAIL_SERVER_SMTP_HOST = "smtp.example.com"
MCP_EMAIL_SERVER_SMTP_PORT = "465"
MCP_EMAIL_SERVER_SMTP_SSL = "true"
MCP_EMAIL_SERVER_ALLOWED_MUTATIONS = "send"               # never delete, move, flag or draft
MCP_EMAIL_SERVER_ALLOWED_RECIPIENTS = "you@example.com"   # comma-separated; * matches anything
