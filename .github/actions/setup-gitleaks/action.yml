name: Set up gitleaks
description: Installs a pinned gitleaks release, after checking it against its published checksum.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 8.30.1
        # From https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
        SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-ARM64) arch=arm64 sha256=$SHA256_ARM64 ;;
          Linux-X64) arch=x64 sha256=$SHA256_X64 ;;
          *) echo "No gitleaks build is pinned for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_$arch.tar.gz"
        echo "$sha256  $archive" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/gitleaks"
        tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"
